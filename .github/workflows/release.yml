name: Release

"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Tagged GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Show the tag being released
        run: echo "Preparing release for ${GITHUB_REF_NAME}"

      - uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: GPG-PUBLIC-KEY.asc
